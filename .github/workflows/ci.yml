name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and npm verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test

      - name: Test npm package tooling
        run: node --test tests/npm/*.test.js

      - name: Validate distribution version contract
        run: node scripts/check-version-sync.js

      - name: Assemble and dry-run bundled npm package
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          bin_dir="$workspace/npm-binaries"
          out_dir="$workspace/dist"
          node - "$bin_dir" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { targets } = require('./npm/platforms.json');
          const binDir = process.argv[2];

          for (const { target, binary } of targets) {
            const binaryPath = path.join(binDir, target, binary);
            fs.mkdirSync(path.dirname(binaryPath), { recursive: true });
            fs.writeFileSync(binaryPath, 'fixture native binary\n');
          }
          NODE
          version="$(node -p "require('./package.json').version")"
          node scripts/assemble-npm-packages.js --version "$version" --bin-dir "$bin_dir" --out-dir "$out_dir"
          (
            cd "$out_dir/okf-wiki"
            npm pack --dry-run
          )
